# Entorno local de pruebas end-to-end: Postgres 17 y el proxy HTTP de Neon.
# El proxy traduce las consultas del driver @neondatabase/serverless hacia Postgres.
# Los puertos del host son configurables mediante E2E_DB_PORT y E2E_PROXY_PORT.
name: start-tank-e2e

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: startank
    ports:
      - "${E2E_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d startank"]
      interval: 2s
      timeout: 3s
      retries: 30

  proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    depends_on:
      db:
        condition: service_healthy
    environment:
      # El host "db" corresponde al servicio de Postgres dentro de la red de Compose.
      PG_CONNECTION_STRING: postgres://postgres:postgres@db:5432/startank
    ports:
      - "${E2E_PROXY_PORT:-55434}:4444"
